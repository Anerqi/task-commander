# Three-platform matrix CI: zero third-party dependencies, pure-stdlib Python script validation
# Triggers: push / pull_request / manual (workflow_dispatch)
# All steps use shell-neutral commands (no redirection, pipes, or grep), so
# each platform's default shell runs them identically
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Three-platform matrix: ubuntu / macos / windows
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # Verify the lowest supported line, a maintained stable line, and the
        # newest stable line.
        python-version:
          - "3.10"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check (py_compile, both scripts)
        run: python -m py_compile scripts/scan-skills.py scripts/validate-project-state.py

      - name: --help smoke test (both scripts; CLI usable, exit code 0)
        run: |
          python scripts/scan-skills.py --help
          python scripts/validate-project-state.py --help

      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: scan-skills.py real run assertions
        # --roots points at the repo root (includes the repo's own SKILL.md);
        # --max-results exercises truncation in practice. The inline Python
        # runs the script via subprocess and asserts the JSON result fields;
        # a failed assertion exits non-zero and fails this step
        run: |
          python -c "import json, subprocess, sys; p = subprocess.run([sys.executable, 'scripts/scan-skills.py', '--roots', '.', '--max-results', '5'], capture_output=True); assert p.returncode == 0, p.stderr.decode('utf-8'); d = json.loads(p.stdout.decode('utf-8')); assert isinstance(d['unique_skills_scanned'], int) and d['unique_skills_scanned'] >= 1; assert isinstance(d['candidates_returned'], int) and d['candidates_returned'] >= 1"

      - name: scan-skills.py host profile smoke test
        # Every discovery profile must run cleanly on any platform, and
        # --project-root must anchor discovery. Header lines are printed so a
        # failure shows which profile broke. This asserts the CLI contract
        # only: it does not prove a live host integration, and CI has no
        # installed skills, so candidate counts are not asserted here.
        run: |
          python -c "
          import json, subprocess, sys
          hosts = ['all', 'codex', 'opencode', 'claude-code', 'cursor', 'copilot', 'pi']
          for host in hosts:
              process = subprocess.run([sys.executable, 'scripts/scan-skills.py', '--host', host, '--project-root', '.', '--max-results', '5'], capture_output=True)
              assert process.returncode == 0, (host, 'exit', process.returncode, process.stderr.decode('utf-8'))
              payload = json.loads(process.stdout.decode('utf-8'))
              assert isinstance(payload['roots'], list) and isinstance(payload['candidates'], list), host
              print(host, 'ok, roots:', len(payload['roots']))
          "

      - name: scan-skills.py explicit-root discovery of this repository
        # The repository's own SKILL.md is not inside a host skill directory,
        # so it is found through explicit --roots rather than a profile.
        run: |
          python -c "import json, subprocess, sys; p = subprocess.run([sys.executable, 'scripts/scan-skills.py', '--roots', '.', '--query-terms', 'task-commander'], capture_output=True); assert p.returncode == 0, p.stderr.decode('utf-8'); d = json.loads(p.stdout.decode('utf-8')); assert any(c['name'] == 'task-commander' for c in d['candidates']), d['roots']"

      - name: validate-project-state.py real run
        # Full structural validation of the in-repo template
        # templates/project-status.md; the spec file is located by the
        # script relative to its own position (templates/task-state-spec.txt),
        # with no out-of-repo dependency; a failed validation (including
        # format errors) exits with code 1 and fails this step
        run: python scripts/validate-project-state.py --path templates/project-status.md
