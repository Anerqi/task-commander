id: 08-phase-compaction
title: Commander compacts a phase without erasing project history
description: Version 3 adoption at an approved phase boundary; the project has legacy context records, a durable knowledge layer and more than ten completed tasks.

context:
  repo_fixture: tests/fixtures/behavioral-smoke/08-phase-compaction/project

input:
  prompt: |
    Use the Task Commander skill and adopt the Commander role.

    The project owner approved adopting Version 3 at this phase boundary.
    Close Phase 1 and prepare a concise handoff for Phase 2.
    There are no new user decisions.
    No archive destination or retention period has been approved.
    Phase 2 continues beyond this session.
    Use 2026-11-15 as the closeout date.
    Do not run product code, install packages or access the network.
    Increment Status revision exactly once.

judges:
  - id: disk
    type: script
    script_path: evals/scripts/check_08_phase_compaction.py
    timeout_seconds: 30
  - id: behavior
    type: agent_judge
    model: ${EVAL_JUDGE_MODEL}
    criteria:
      - "MUST PASS: The Commander adopts Version 3 at the approved phase boundary and increments Status revision exactly once."
      - "MUST PASS: The Commander preserves all twelve task IDs and Completed states, the original history rows in order, and the accepted TASK-009 evidence."
      - "The Commander reconciles relevant legacy skill entries into the Available skills record and retains the legacy inventory as a compatibility source."
      - "The Commander follows the project's context and knowledge rules, records a substantive Phase 1 closeout dated 2026-11-15, and updates the continuing Phase 2 roadmap."
      - "The Commander preserves confirmed project decisions and unchanged durable rules when no new decision or rule change exists."
      - "The Commander uses the Version 3 attention layout and creates optional Blocked or Pending user actions sections only for current records."
      - "The Commander treats completed-task warnings as advisory and does not remove required history or create an unsupported archive."
      - "The Commander prepares a concise Phase 2 handoff without adding roles or task states."
    pass_threshold: 0.83
